name = "jewelry-store"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
ADMIN_EMAIL = "gurleenchadha1@gmail.com"
FROM_EMAIL = "onboarding@resend.dev"
# Public site URL — used by auth, sitemap, robots, and canonical/OG tags.
NEXTAUTH_URL = "https://ezmayjewels.com"

# --- Storefront / India config (non-sensitive; safe to commit) ---
# Shopify Storefront API
SHOPIFY_STORE_DOMAIN = "your-store.myshopify.com"
SHOPIFY_STOREFRONT_API_VERSION = "2025-04"
# GST rate used for on-storefront display only (authoritative tax is Shopify's)
NEXT_PUBLIC_GST_RATE = "0.03"
# Shiprocket pickup origin for serviceability checks
SHIPROCKET_PICKUP_PINCODE = "110001"

# --- SECRETS: do NOT put these here. Set with `wrangler secret put <NAME>` ---
#   AUTH_SECRET                    NextAuth session signing key (random 32+ bytes)
#   ADMIN_PASSWORD_HASH            bcrypt hash of the admin login password
#   RESEND_API_KEY                 transactional email
#   SHOPIFY_STOREFRONT_API_TOKEN   Storefront API public access token
#   SHOPIFY_WEBHOOK_SECRET         Shopify webhook signing secret (API secret key)
#   SHIPROCKET_EMAIL               Shiprocket API user email
#   SHIPROCKET_PASSWORD            Shiprocket API user password

[[d1_databases]]
binding = "DB"
database_name = "jewelry-store-db"
database_id = "f322a821-758e-4524-aceb-57646d29eb2a"
remote = true
